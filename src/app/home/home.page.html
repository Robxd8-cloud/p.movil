<ion-header [translucent]="true">
  <ion-toolbar color="danger">
    <ion-title>
      Pokédex UPVT
    </ion-title>
  </ion-toolbar>
  <ion-toolbar *ngIf="!selectedPokemon">
    <ion-searchbar placeholder="Buscar Pokémon..." (ionInput)="buscarPokemon($event)"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-grid *ngIf="!selectedPokemon">
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" *ngFor="let poke of filteredPokemon">
        <ion-card button="true" (click)="verDetalles(poke.id)" style="text-align: center;">
          <img [src]="poke.image" style="height: 120px; margin-top: 10px;" />
          <ion-card-header>
            <ion-card-subtitle>#{{ poke.id | number:'3.0-0' }}</ion-card-subtitle>
            <ion-card-title style="text-transform: capitalize;">{{ poke.name }}</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div *ngIf="selectedPokemon">
    <ion-button expand="block" color="medium" (click)="cerrarDetalles()" class="ion-margin-bottom">
      <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
      Volver a la lista
    </ion-button>

    <ion-card style="text-align: center;">
      <img [src]="selectedPokemon.sprites.other['official-artwork'].front_default" style="height: 250px; background: #f4f5f8; border-radius: 10px; margin: 10px auto; display: block;" />
      
      <ion-card-header>
        <ion-card-subtitle>#{{ selectedPokemon.id | number:'3.0-0' }}</ion-card-subtitle>
        <ion-card-title style="text-transform: capitalize; font-size: 2em;">{{ selectedPokemon.name }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-chip *ngFor="let tipo of selectedPokemon.types" color="primary">
          <ion-label style="text-transform: capitalize;">{{ tipo.type.name }}</ion-label>
        </ion-chip>

        <h3 style="margin-top: 20px; text-align: left;">Estadísticas Base</h3>
        <ion-list lines="none">
          <ion-item *ngFor="let stat of selectedPokemon.stats">
            <ion-label style="text-transform: capitalize;">{{ stat.stat.name }}</ion-label>
            <ion-progress-bar [value]="stat.base_stat / 150" color="success" style="width: 50%;"></ion-progress-bar>
            <span slot="end" style="width: 30px; text-align: right;">{{ stat.base_stat }}</span>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </div>

</ion-content>
